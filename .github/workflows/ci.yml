name: CI
on:
  push:
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/IncidentMcpServer/IncidentMcpServer.csproj
      - run: dotnet build src/IncidentMcpServer/IncidentMcpServer.csproj --no-restore --configuration Release
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r python-client/requirements.txt
      - run: python -m compileall -q python-client
